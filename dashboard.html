  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#F0EDE6;--surface3:#E8E3D8;
      --border:#E0DCD2;--border2:#C8C4BA;--text:#1A1814;--muted:#8A8278;
      --faint:#C8C4BA;--amber:#C48820;--teal:#2A9F84;--coral:#C84A28;
      --green:#5A9840;--green-light:#EBF4E6;--amber-light:#FFF8E8;
      --header-h:48px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh;line-height:1.5}
    .header{position:sticky;top:0;z-index:20;height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .logo{font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
    .logo span{color:var(--muted);font-weight:300}
    .header-right{display:flex;align-items:center;gap:12px}
    .btn{font-family:inherit;font-size:12px;padding:5px 12px;border-radius:4px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s}
    .btn:hover{border-color:var(--text);color:var(--text)}
    .btn:disabled{opacity:.5;cursor:default}
    .btn-primary{background:var(--text);color:var(--bg);border-color:var(--text);width:100%;padding:9px;font-size:13px;margin-top:6px}
    .btn-primary:hover{opacity:.85}
    .connect-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - var(--header-h));padding:24px}
    .connect-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:32px;width:100%;max-width:400px}
    .connect-card h2{font-size:15px;font-weight:500;margin-bottom:6px}
    .connect-card p{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.7}
    .token-input{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:4px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
    .token-input:focus{border-color:var(--text)}
    .connect-error{font-size:12px;color:var(--coral);margin-top:8px;display:none}
    .main{max-width:1100px;margin:0 auto;padding:28px 24px 48px}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
    .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 18px}
    .kpi-label{font-size:11px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
    .kpi-value{font-size:26px;font-weight:500;line-height:1;color:var(--text)}

    /* ── Progress bar ── */
    .progress-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:20px}
    .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
    .progress-title{font-size:12px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
    .progress-revenue{font-size:18px;font-weight:500;color:var(--text)}
    .progress-revenue span{font-size:12px;color:var(--muted);font-weight:300}

    .bar-container{position:relative;height:10px;margin-bottom:22px}
    .bar-track{position:absolute;inset:0;background:var(--surface3);border-radius:99px;overflow:hidden}
    .bar-bonus-zone{position:absolute;top:0;bottom:0;background:var(--green-light);border-radius:0 99px 99px 0}
    .bar-fill-pre{position:absolute;top:0;bottom:0;left:0;background:var(--amber);border-radius:99px 0 0 99px;transition:width .5s ease}
    .bar-fill-post{position:absolute;top:0;bottom:0;background:var(--teal);border-radius:0 99px 99px 0;transition:width .5s ease,left .5s ease}
    .bar-goal-line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
    .bar-tick{position:absolute;top:14px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
    .bar-tick.goal-tick{color:var(--text);font-weight:500}
    .bar-tick.bonus-label{color:var(--teal)}

    /* ── Toolbar ── */
    .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .seg{display:flex;border:1px solid var(--border2);border-radius:4px;overflow:hidden}
    .seg-btn{font-family:inherit;font-size:12px;padding:5px 12px;border:none;background:none;color:var(--muted);cursor:pointer}
    .seg-btn.active{background:var(--text);color:var(--bg)}
    .month-input{font-family:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);outline:none}
    .spacer{flex:1}
    .count-label{font-size:12px;color:var(--muted)}

    /* ── Table ── */
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    thead th{padding:10px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
    thead th.r{text-align:right}
    tbody tr{transition:background .1s}
    tbody tr:hover{filter:brightness(.97)}
    .hide-btn{opacity:0;background:none;border:none;cursor:pointer;color:var(--faint);padding:2px 4px;font-size:14px;line-height:1;font-family:inherit;border-radius:3px;transition:opacity .15s,color .15s}
    tr:hover .hide-btn{opacity:1}
    .hide-btn:hover{color:var(--muted)}
    tr.row-hidden{opacity:.35}
    tr.row-hidden .hide-btn{opacity:1;color:var(--teal)}

    /* Week header rows */
    tr.week-hdr td{
      padding:7px 14px;
      font-size:11px;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-weight:500;
      border-top:2px solid var(--border2);
      border-bottom:1px solid var(--border);
    }
    tr.week-hdr:first-child td{border-top:none}

    /* Week bands - alternate surface/surface2 */
    tr.week-even{background:var(--surface)}
    tr.week-odd{background:var(--surface2)}
    tr.week-even:hover{background:#F5F3EE}
    tr.week-odd:hover{background:#E8E5DF}

    /* Bottom border on last row of each week */
    tr.week-last td{border-bottom:1px solid var(--border2)}

    td{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--border)}
    td.r{text-align:right}

    /* Date cell */
    .date-cell{line-height:1.3}
    .date-dow{font-size:13px;font-weight:500;color:var(--text);text-transform:uppercase;letter-spacing:.05em}
    .date-day{font-size:11px;color:var(--muted)}

    /* Viability badge */
    .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;letter-spacing:.04em;white-space:nowrap}
    .badge-runs{background:#E6F4EC;color:#2A7A46}
    .badge-risk{background:#FDE8E8;color:var(--coral)}
    .badge-na{background:var(--surface3);color:var(--muted)}

    tfoot td{padding:10px 14px;font-size:12px;font-weight:500;background:var(--surface2);border-top:2px solid var(--border2)}
    tfoot td.r{text-align:right}
    .empty-row td{padding:40px;text-align:center;color:var(--muted);border:none}
    .page-footer{margin-top:14px;display:flex;justify-content:space-between;font-size:11px;color:var(--faint);flex-wrap:wrap;gap:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .65s linear infinite;vertical-align:-2px;margin-right:6px}
    @media(max-width:640px){
      /* Header */
      .header{padding:0 12px;height:44px}
      .header-right{gap:6px}
      #last-updated{display:none}
      .btn{padding:4px 8px;font-size:11px}

      /* Tab bar: single scrollable row */
      .seg{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
      .seg::-webkit-scrollbar{display:none}
      .seg-btn{white-space:nowrap;padding:6px 11px;font-size:11px;flex-shrink:0}

      /* Main padding */
      .main{padding:12px 10px 40px}

      /* KPI grid: 2 columns */
      .kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px}
      .kpi-value{font-size:20px}
      .kpi-card{padding:12px 14px}

      /* Progress bar */
      .progress-section{padding:14px}
      .bar-tick{font-size:9px}

      /* Toolbar */
      .toolbar{gap:6px}
      .count-label{display:none}

      /* Tables */
      td,thead th{padding:7px 8px;font-size:12px}
      tfoot td{padding:8px}

      /* Connect card */
      .connect-card{padding:24px 18px}

      /* Force all inline-style grids to single column on mobile */
      [style*="grid-template-columns"]{grid-template-columns:1fr !important}

      /* Chart containers: cap height on mobile */
      canvas{max-height:220px}
    }
  </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>

<header class="header">
  <div class="logo">Sofar LA <span>/ Sales</span></div>
  <div class="header-right">
    <span id="last-updated" style="font-size:11px;color:var(--muted)"></span>
    <button class="btn" id="refresh-btn" style="display:none" onclick="doRefresh()">Refresh</button>
    <button class="btn" id="disconnect-btn" style="display:none" onclick="disconnect()">Sign out</button>
  </div>
</header>

<div id="connect-view" class="connect-screen">

    <h2>Sofar LA dashboard</h2>
    <p>Enter the team passcode. Saved in your browser — you won't need to re-enter it.</p>
    <input type="password" class="token-input" id="token-input" placeholder="passcode" autocomplete="off">
    <div class="connect-error" id="connect-error"></div>
    <button class="btn btn-primary" id="connect-btn" onclick="doConnect()">Connect</button>

</div>

<div id="dashboard-view" class="main" style="display:none">

    <button class="seg-btn" id="tab-forecast" onclick="setTab('forecast')">Forecast</button>
    <button class="seg-btn" id="tab-pl" onclick="setTab('pl')">P&amp;L</button>
    <button class="seg-btn" id="tab-breakdowns" onclick="setTab('breakdowns')">Breakdowns</button>
    <button class="seg-btn" id="tab-nbhd" onclick="setTab('nbhd')">Neighborhoods</button>
    <button class="seg-btn" id="tab-pricing" onclick="setTab('pricing')">Pricing</button>
  </div>
  <div id="sales-pane">
  <div class="kpi-grid" id="kpi-grid"></div>
  <div class="progress-section" id="progress-section"></div>
  <div class="toolbar">
    <div class="seg">
      <button class="seg-btn active" id="seg-month" onclick="setView('month')">Month</button>
      <button class="seg-btn" id="seg-all" onclick="setView('all')">All LA</button>
    </div>
    <input type="month" class="month-input" id="month-input" value="2026-06" oninput="setMonth(this.value)">
    <div class="spacer"></div>
    <button class="btn" id="hidden-toggle-btn" style="display:none;font-size:11px" onclick="toggleShowHidden()"></button>
    <span class="count-label" id="count-label"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:90px">Date</th>
          <th>Venue</th>
          <th class="r">Sold</th>
          <th class="r">Cap</th>
          <th class="r" title="Show runs at 30+ tickets sold">Status<br><span style="font-size:10px;letter-spacing:0;text-transform:none;font-weight:300">(runs ≥ 30)</span></th>
          <th class="r">Revenue</th>
          <th class="r" title="Projected final tickets / revenue range, updates with sales">Projected</th>
          <th style="width:32px"></th>
        </tr>
      </thead>
      <tbody id="tbl-body"></tbody>
      <tfoot id="tbl-foot"></tfoot>
    </table>
  </div>
  </div><!-- /sales-pane -->
  <div id="forecast-pane" style="display:none"></div>
  <div id="pl-pane" style="display:none"></div>
  <div id="breakdowns-pane" style="display:none"></div>
  <div id="nbhd-pane" style="display:none"></div>
  <div id="pricing-pane" style="display:none"></div>
  <div class="page-footer">
    <span id="footer-left"></span>
    <span id="footer-right"></span>
  </div>
</div>

  const PDOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function pdInterp(c,d){const MS=PD.milestones;if(d>=30)return c['30'];if(d<=0)return c['0'];
    for(let i=0;i<MS.length-1;i++){const hi=MS[i],lo=MS[i+1];if(d<=hi&&d>=lo){const t=(d-lo)/(hi-lo);return c[String(lo)]+t*(c[String(hi)]-c[String(lo)]);}}return c['0'];}
  function pdDaysUntil(s){if(!s)return null;const t=new Date();t.setHours(0,0,0,0);const d=new Date(String(s).slice(0,10)+'T00:00:00');return Math.round((d-t)/86400000);}

  function pdNorm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
  function pdStripParen(s){return pdNorm(s).replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').trim();}
  function pdSlug(s){return String(s||'').toLowerCase().replace(/-/g,' ').replace(/\s+/g,' ').trim();}
  function pdMatchVenue(name){
    if(!PD||!name)return null;
    const n=pdNorm(name); let v=PD.venues.find(x=>pdNorm(x.name)===n);
    if(!v){const sp=pdStripParen(name); v=PD.venues.find(x=>pdStripParen(x.name)===sp);}

    if(t==='breakdowns')renderBreakdowns();
    if(t==='nbhd')renderNbhd();
    if(t==='pricing')renderPricing();
  }
  // ── Forecast: attendance predictor ──────────────────
  function fcProject(sel,dow,days,sold,cap){
    if(!PD)return null;
    let prior,klass='typical',basis,vobj=null;
    if(sel&&sel.slice(0,2)==='v:'){vobj=PD.venues.find(x=>x.name===sel.slice(2));
      if(vobj){prior={med:vobj.draw_med,lo:vobj.draw_p25,hi:vobj.draw_p75};klass=vobj.klass;basis=vobj.name+' — own history · '+vobj.shows+' shows';}}
    else if(sel&&sel.slice(0,2)==='n:'){const n=PD.nbhd_draw[sel.slice(2)];
      if(n){prior={med:n.med,lo:n.p25,hi:n.p75};basis=sel.slice(2)+' — neighborhood average';}}
    if(!prior){const dd=PD.dow_draw[dow];
      if(dd&&PD.periods.all.by_dow[dow]&&PD.periods.all.by_dow[dow].shows>=5){prior={med:dd.med,lo:dd.p25,hi:dd.p75};basis=dow+' average';}
      else{prior={med:PD.overall_draw.med,lo:PD.overall_draw.p25,hi:PD.overall_draw.p75};basis='LA average';}}
    const seg=PD.periods.all.by_dow[dow];
    const spread=(seg&&seg.spread&&seg.spread.n>=8)?seg.spread:PD.periods.all.overall.spread;
    let boxes,loTix,hiTix,head;
    if(days===0){
      const d=(vobj&&vobj.dayof_med!=null)?{med:vobj.dayof_med,lo:vobj.dayof_lo,hi:vobj.dayof_hi}:(PD.dayof_dow&&PD.dayof_dow[dow])?PD.dayof_dow[dow]:PD.dayof_overall;
      const pr=sh=>Math.round(sold/(1-Math.min(Math.max(sh,0),80)/100));
      boxes=[{k:'light',label:'Light door',val:pr(d.lo)},{k:'typical',label:'Typical',val:pr(d.med)},{k:'big',label:'Big door',val:pr(d.hi)}];
      loTix=pr(d.med);hiTix=pr(d.hi);head='typical';
    }else{
      const pf=pk=>{const fr=Math.max(1,pdInterp(spread[pk],days));return Math.round(sold+(1-fr/100)*prior.med);};
      const early=pf('p80'),typ=pf('p50'),late=pf('p20');
      boxes=[{k:'early',label:'Sells early',val:early},{k:'typical',label:'Typical',val:typ},{k:'late',label:'Runs late',val:late}];
      if(klass==='early'){loTix=early;hiTix=typ;}else{loTix=typ;hiTix=late;}
      head=(klass==='early')?'early':(klass==='late')?'late':'typical';
    }
    let sellout=false;
    if(cap>0){boxes=boxes.map(b=>({...b,capped:b.val>=cap,val:Math.min(b.val,cap)}));if(hiTix>=cap){hiTix=cap;sellout=true;}if(loTix>cap)loTix=cap;}
    if(loTix>hiTix){const t=loTix;loTix=hiTix;hiTix=t;}
    return {prior,klass,basis,boxes,loTix,hiTix,head,sellout,dayOf:days===0};
  }
  function fcRender(){
    const g=id=>document.getElementById(id);
    if(!g('fc-venue'))return;
    const sel=g('fc-venue').value,dow=g('fc-dow').value;
    const days=Math.max(0,parseInt(g('fc-days').value)||0);
    const sold=Math.max(0,parseInt(g('fc-sold').value)||0);
    const cap=parseInt(g('fc-cap').value)||0;
    const p=fcProject(sel,dow,days,sold,cap);
    if(!p){g('fc-out').innerHTML='No data loaded.';return;}
    const rng=p.loTix===p.hiTix?`${p.loTix}`:`${p.loTix}–${p.hiTix}`;
    const boxHTML=p.boxes.map(b=>{const on=b.k===p.head;return `<div style="flex:1;text-align:center;padding:9px 4px;border:1px solid ${on?'var(--amber)':'var(--border)'};border-radius:8px;background:${on?'var(--amber-light)':'var(--surface)'}">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:${b.capped?'var(--coral)':'var(--muted)'}">${b.label}</div>

      <div style="font-size:9px;color:${b.capped?'var(--coral)':'var(--muted)'}">${b.capped?'sells out':(b.k==='late'||b.k==='big'?'high end':b.k==='early'||b.k==='light'?'low end':'most likely')}</div></div>`;}).join('');
    g('fc-out').innerHTML=`
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)">Projected final${p.dayOf?' · day of show':''}</div>
      <div style="font-size:34px;font-weight:500;color:var(--text);line-height:1.1;margin:2px 0 4px">${rng} <span style="font-size:14px;color:var(--muted)">tickets</span>${p.sellout?' <span style="font-size:11px;color:var(--coral)">SELLOUT</span>':''}</div>
      <div style="display:flex;gap:8px;margin:12px 0 8px">${boxHTML}</div>

  }

  // ── P&L calculator ──────────────────────────────────
  function plCompute(i){
    const gross=i.price*i.tix, ticketFees=2*i.tix, tax=(i.taxPct/100)*gross;
    const revenue=gross+ticketFees+tax;
    const stripe=0.029*gross, pros=0.0181*gross;
    const crew=211.25+Math.max(0,i.crew-2)*80;
    const cogs=i.insurance+stripe+pros+i.artistFees+i.other+i.sound+crew;
    const supplies=i.supplies1+i.supplies2;
    const cm1=revenue-cogs-supplies, gm=revenue>0?cm1/revenue*100:0;
    return {gross,ticketFees,tax,revenue,stripe,pros,crew,insurance:i.insurance,artistFees:i.artistFees,other:i.other,sound:i.sound,cogs,supplies,cm1,gm};
  }
  function plRender(){
    const g=id=>{const el=document.getElementById(id);return el?(parseFloat(el.value)||0):0;};
    if(!document.getElementById('pl-price'))return;
    const r=plCompute({price:g('pl-price'),taxPct:g('pl-tax'),tix:g('pl-tix'),crew:g('pl-crew'),artistFees:g('pl-artistfees'),insurance:g('pl-insurance'),sound:g('pl-sound'),other:g('pl-other'),supplies1:g('pl-sup1'),supplies2:g('pl-sup2')});
    const m=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const row=(label,val,o)=>{o=o||{};return `<div style="display:flex;justify-content:space-between;padding:4px 0;${o.indent?'padding-left:14px;':''}font-size:${o.size||'13px'};${o.bold?'font-weight:600;':''}color:${o.color||'var(--text)'};${o.border?'border-top:1px solid var(--border);margin-top:4px;padding-top:7px;':''}"><span style="${o.muted?'color:var(--muted)':''}">${label}</span><span>${val}</span></div>`;};
    document.getElementById('pl-statement').innerHTML=
      row('Gross Ticket Value',m(r.gross),{indent:1,muted:1})+
      row('Ticket Fees ($2/tix)',m(r.ticketFees),{indent:1,muted:1})+
      (r.tax>0?row('Tax',m(r.tax),{indent:1,muted:1}):'')+
      row('Revenue',m(r.revenue),{bold:1,border:1})+
      '<div style="height:12px"></div>'+
      row('Insurance',m(r.insurance),{indent:1,muted:1})+
      row('Stripe Fees (2.9%)',m(r.stripe),{indent:1,muted:1})+
      row('PROs (1.81%)',m(r.pros),{indent:1,muted:1})+
      row('Artist Fees',m(r.artistFees),{indent:1,muted:1})+
      (r.other>0?row('Photo / Venue / Other',m(r.other),{indent:1,muted:1}):'')+

      row('CM1 · Net Show Profit',m(r.cm1),{bold:1,size:'20px',color:r.cm1>=0?'var(--green)':'var(--coral)',border:1})+
      row('Gross Margin',r.gm.toFixed(2)+'%',{muted:1});
  }

  function buildNbhdScatter(){
    const colors={'Central LA':'#4C7DA6','DTLA':'#E58A2B','Eastside':'#D6453F','Hollywood / WeHo':'#6BB1A8','Outer LA':'#4C9A4C','Westside':'#E2B33E'};

    const W=720,H=470,L=58,Rm=18,T=22,B=96;
    const pw=W-L-Rm, ph=H-T-B;
    const xs=rows.map(r=>r.sold), ys=rows.map(r=>r.rev);
    const xMin=Math.floor((Math.min(...xs)-6)/10)*10, xMax=Math.ceil((Math.max(...xs)+6)/10)*10;
    const yMax=Math.ceil(Math.max(...ys)*1.08/500)*500, yMin=0;
    const sx=v=>L+(v-xMin)/(xMax-xMin)*pw;
    const sy=v=>T+ph-(v-yMin)/(yMax-yMin)*ph;
    const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
    const meanX=mean(xs), meanY=mean(ys);
    const rad=s=>Math.max(4,Math.sqrt(s)*4.0);
    // y gridlines + ticks
    let grid='';
    for(let v=0;v<=yMax;v+=500){const y=sy(v);grid+=`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${L-8}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${v===0?'0':'$'+(v/1000)+'k'}</text>`;}

    let xtick='';

    // average crosshair
    const ax=sx(meanX), ay=sy(meanY);

      <text x="${ax+4}" y="${T+9}" font-size="8" fill="var(--muted)">avg sold</text>
      <text x="${L+3}" y="${ay-4}" font-size="8" fill="var(--muted)">avg rev</text>`;
    // bubbles (big first)
    const sorted=[...rows].sort((a,b)=>b.shows-a.shows);
    const bub=sorted.map(r=>{
      const cx=sx(r.sold),cy=sy(r.rev),rr=rad(r.shows),c=colors[r.area]||'#999';
      const lbl=r.shows>=5?`<text x="${cx+rr+3}" y="${cy+3}" font-size="9" fill="var(--text)">${r.name}</text>`:'';
      return `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${c}" fill-opacity="0.7" stroke="${c}" stroke-width="1"><title>${r.name} — ${r.shows} shows · ${r.sold} sold · ${money0(r.rev)}/show</title></circle>${lbl}`;
    }).join('');
    // axis titles
    const titles=`<text x="${L+pw/2}" y="${T+ph+30}" text-anchor="middle" font-size="10" fill="var(--muted)">Avg tickets sold / show</text>
      <text transform="translate(14 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-size="10" fill="var(--muted)">Avg revenue / show</text>`;
    // legend
    const areas=Object.keys(colors);
    let lx=L, leg='';
    areas.forEach(a=>{const w=a.length*5.6+18;leg+=`<rect x="${lx}" y="${H-26}" width="9" height="9" rx="2" fill="${colors[a]}"/><text x="${lx+13}" y="${H-18}" font-size="9" fill="var(--muted)">${a}</text>`;lx+=w;if(lx>W-90){lx=L;}});
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="'DM Mono',monospace">
      ${grid}${xtick}${avg}${bub}${titles}
      <line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="var(--border2)" stroke-width="1"/>
      <line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="var(--border2)" stroke-width="1"/>
      ${leg}
    </svg>`;
  }

  // ════════════════════════════════════════════════════════════════
  //  PRICING TAB  ·  Recommender / Segmentation / Early Bird / Calculator
  //  Reuses existing: F, S, PD, projectShow, pdDaysUntil, pdDow, pdInterp
  // ════════════════════════════════════════════════════════════════
  let pricingSub='recommender';
  const PRICE_OVERRIDE_KEY='sofar_pricing_overrides';
  let pricingOverrides=JSON.parse(localStorage.getItem(PRICE_OVERRIDE_KEY)||'{}');
  let ebTimingChart=null;

  // base standard price by [day bucket][experience]
  const PRICE_MATRIX={
    weeknight:{community:25,standard:28,premium:32},
    weekend:{community:30,standard:34,premium:40},
    sunday:{community:32,standard:38,premium:44}
  };
  function priceDayBucket(dow){ if(dow==='Fri'||dow==='Sat')return 'weekend'; if(dow==='Sun')return 'sunday'; return 'weeknight'; }
  function inferExperience(price){ if(price>=35)return 'premium'; if(price<=26)return 'community'; return 'standard'; }
  function setPricingSub(s){ pricingSub=s; renderPricing(); }
  function setShowExp(id,val){
    if(val==='auto') delete pricingOverrides[id]; else pricingOverrides[id]=val;
    localStorage.setItem(PRICE_OVERRIDE_KEY,JSON.stringify(pricingOverrides));
    renderPricing();
  }

  function recommendShow(r){
    const f=r.fields, dateStr=f[F.date]||'';
    const du=pdDaysUntil(dateStr), dow=pdDow(dateStr), bucket=priceDayBucket(dow);
    const tix=Number(f[F.tickets])||0, rev=revenueFor(f), cap=Number(f[F.cap])||0;
    const inferredPrice=(tix>0&&rev>0)?rev/tix:PRICE_MATRIX[bucket].standard;
    const auto=inferExperience(inferredPrice);
    const exp=pricingOverrides[r.id]||auto;
    const base=PRICE_MATRIX[bucket][exp];
    let structure,eb,std,why;
    if(bucket==='weekend'||bucket==='sunday'){
      structure='anchor'; eb=base; std=Math.round(base*1.15);
      why='Least price-sensitive, real early demand — anchor the early bird at the familiar price and raise the standard above it.';
    }else{
      structure='discount'; std=base; eb=Math.round(base*0.8);
      why='Price-sensitive, late-buying room — hold the standard and let the early bird be the discount, so a higher price doesn’t suppress the final-week volume that fills the room.';
    }
    const proj=projectShow(f);
    let capWarn=null;
    if(cap>0&&proj){
      if(cap>=100&&proj.hiTix<cap*0.8) capWarn=`Oversized room — projected ${proj.loTix}–${proj.hiTix} won’t fill ${cap}. Right-size toward 76–100 if you can.`;
      else if(proj.hiTix<cap*0.7) capWarn=`Cap runs ahead of demand (${proj.loTix}–${proj.hiTix} projected vs ${cap}).`;
    }
    return {id:r.id,venue:f[F.venue]||'—',dateStr,dow,du,bucket,exp,auto,structure,eb,std,why,proj,cap,capWarn};
  }

  // ── shared bits ─────────────────────────────────────────────

  function renderPricing(){

    const subs=[['recommender','Recommender'],['segmentation','Segmentation'],['earlybird','Early Bird'],['calculator','Calculator']];

    else if(pricingSub==='segmentation') renderSegmentation();
    else if(pricingSub==='earlybird') renderEarlyBird();
    else renderCalculator();

  // ── 1 · RECOMMENDER (live per-show, reads S.records) ─────────
  function renderRecommender(){
    const up=[...S.records]
      .filter(r=>{const d=pdDaysUntil(r.fields[F.date]);return d!=null&&d>=0;})
      .sort((a,b)=>(a.fields[F.date]||'').localeCompare(b.fields[F.date]||''));
    const recs=up.map(recommendShow);
    const nAnchor=recs.filter(x=>x.structure==='anchor').length;
    const nDisc=recs.length-nAnchor;
    let body=`<div style="${pCard};margin-bottom:14px">
      <div style="font-size:15px;font-weight:500;margin-bottom:4px">Per-show recommendation</div>
      <div style="font-size:12px;color:var(--muted)">Runs the rules engine on every upcoming show in the current view (${recs.length} show${recs.length!==1?'s':''} · ${nAnchor} anchor-&-raise · ${nDisc} discount-hold). Experience is inferred from price &amp; cap; override per show below — it sticks in your browser, no Airtable change needed.</div>
    </div>`;
    if(!recs.length){
      body+=`<div style="${pCard};color:var(--muted)">No upcoming shows in the current view. Switch to “All LA” or a future month to see recommendations.</div>`;
      document.getElementById('pricing-body').innerHTML=body; return;
    }
    const expSel=(rec)=>{
      const opts=[['auto','Auto ('+rec.auto+')'],['standard','Standard'],['premium','Premium'],['community','Community']];

    body+=recs.map(rec=>{
      const isAnchor=rec.structure==='anchor';
      const badgeBg=isAnchor?'#E8F0FB':'var(--green-light)', badgeFg=isAnchor?'#2A5499':'#2A7A46';
      const structLbl=isAnchor?'Anchor &amp; raise':'Discount, hold standard';
      const segLine=isAnchor
        ? 'Push alumni + active local at the new standard; the early bird (old price) is the open “deal.” Reserve the 10% code for lapsed locals only.'
        : 'Push alumni + active local at standard; early bird is the discount. Reserve the deepest 10% code for lapsed locals only.';
      return `<div style="${pCard};margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div>
            <div style="font-size:14px;font-weight:500">${rec.venue}</div>
            <div style="font-size:12px;color:var(--muted)">${rec.dow} · ${fmtShort(rec.dateStr)} · ${rec.du}d out · cap ${rec.cap||'—'}</div>
          </div>
          <div style="text-align:right">
            <div style="${pLbl};margin-bottom:4px">Experience</div>${expSel(rec)}
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin:12px 0 8px;flex-wrap:wrap">
          <span style="${'background:'+badgeBg+';color:'+badgeFg+';font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px'}">${structLbl}</span>
          <span style="font-size:13px"><b style="color:var(--amber)">$${rec.eb}</b> early bird</span>
          <span style="color:var(--faint)">→</span>
          <span style="font-size:13px"><b>$${rec.std}</b> standard</span>
          <span style="font-size:11px;color:var(--muted)">· window 8–14 days out</span>
        </div>
        <div style="font-size:12px;color:var(--muted);line-height:1.5">${rec.why}</div>
        ${rec.capWarn?`<div style="font-size:12px;color:var(--coral);margin-top:8px">⚠ ${rec.capWarn}</div>`:''}
        <div style="font-size:11px;color:var(--muted);margin-top:8px;border-top:1px solid var(--border);padding-top:8px">${segLine}</div>
      </div>`;
    }).join('');
    document.getElementById('pricing-body').innerHTML=body;
  }

  // ── 2 · SEGMENTATION (static framework) ──────────────────────

  // ── 3 · EARLY BIRD (strategy + timing + P&L deltas) ──────────
  function ebSold(pace,day){ return 100-pdInterp(pace,day); }
  function ebWin(pace,hi,lo){ return Math.max(0, ebSold(pace,lo)-ebSold(pace,hi)); }
  function renderEarlyBird(){
    document.getElementById('pricing-body').innerHTML=`
      <div style="${pCard};margin-bottom:14px">

  function drawEbTiming(){

    const ds=Object.keys(dows).map(d=>{

  // ── 4 · CALCULATOR (her way / my way toggle) ─────────────────
  let calc={structure:'discount',cap:60,std:42,eb:38,baseline:40,ebShare:25,uplift:4};
  const CALC_FIXED=300+211.25+185+20+70; // artist + crew + AE + insurance + platform
  function ebCm1(price,tix){ const gross=price*tix, rev=gross+2*tix; return rev-0.029*gross-0.0181*gross-CALC_FIXED; }
  function calcCompute(){
    const i=calc, total=i.baseline+i.uplift;
    const ebTix=Math.round(total*i.ebShare/100), stdTix=total-ebTix;
    const gross=ebTix*i.eb+stdTix*i.std, rev=gross+2*total;
    const cm1=rev-0.029*gross-0.0181*gross-CALC_FIXED;
    const basePrice=i.structure==='anchor'?i.eb:i.std; // no-EB baseline price
    const baseCm1=ebCm1(basePrice,i.baseline);
    return {total,ebTix,stdTix,rev,cm1,baseCm1,delta:cm1-baseCm1,basePrice};
  }
  function setCalc(k,v){ calc[k]=v; renderCalcResult(); }
  function setCalcStruct(s){ calc.structure=s; renderCalculator(); }
  function setEbPreset(v){ calc.eb=v; const el=document.getElementById('calc-eb'); if(el)el.value=v; renderCalcResult(); }
  function renderCalculator(){

    const row=(id,label,sub,min,max,val,fmt)=>`<div style="display:flex;align-items:center;gap:14px;padding:8px 0">

        <input id="${id}" type="range" min="${min}" max="${max}" value="${val}" style="flex:1.2" oninput="setCalc('${id.replace('calc-','')}',+this.value);document.getElementById('${id}-v').textContent='${fmt}'.replace('@',this.value)">

    document.getElementById('pricing-body').innerHTML=`
      <div style="${pCard};margin-bottom:14px">
        <div style="font-size:15px;font-weight:500;margin-bottom:4px">Early bird break-even</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Flip the structure and stress-test the bet. Everything recalculates live against a no-early-bird baseline.</div>
        <div class="seg" style="display:inline-flex">
          <button class="seg-btn${!anchor?' active':''}" onclick="setCalcStruct('discount')">My way · discount, hold</button>
          <button class="seg-btn${anchor?' active':''}" onclick="setCalcStruct('anchor')">Her way · anchor &amp; raise</button>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:8px">${anchor?'Standard is raised above the familiar price; early bird = today’s price (the “deal”).':'Standard is held; early bird is the discount below it.'}</div>
      </div>
      <div style="${pCard};margin-bottom:14px">
        <div style="${pH}">Show setup</div>
        ${row('calc-cap','Capacity','seats available',20,150,calc.cap,'@')}
        ${row('calc-std','Standard price','charged after the window closes',20,60,calc.std,'$@')}
        <div style="display:flex;align-items:center;gap:14px;padding:8px 0">
          <div style="flex:1"><div style="font-size:13px;font-weight:500">Early bird price</div><div style="font-size:11px;color:var(--muted)">tap a preset or fine-tune</div></div>
          <div style="display:flex;gap:6px">
            ${[calc.std-2,calc.std-4,calc.std-6].map((v,idx)=>`<button onclick="setEbPreset(${v})" style="font-family:inherit;font-size:12px;padding:6px 12px;border-radius:7px;border:1px solid ${calc.eb===v?'var(--text)':'var(--border2)'};background:${calc.eb===v?'var(--text)':'var(--surface)'};color:${calc.eb===v?'var(--bg)':'var(--text)'};cursor:pointer">$${v}<div style="font-size:9px;opacity:.7">${['shallow','balanced','deep'][idx]}</div></button>`).join('')}
          </div>
          <input id="calc-eb" type="number" value="${calc.eb}" style="width:56px;padding:6px;border:1px solid var(--border2);border-radius:6px;font-family:inherit;background:var(--bg);color:var(--text)" oninput="setCalc('eb',+this.value)">
        </div>
      </div>
      <div style="${pCard};margin-bottom:14px">
        <div style="${pH}">Demand read</div>
        ${row('calc-baseline','Tickets you’d sell without any promo','your honest baseline',10,120,calc.baseline,'@')}
        ${row('calc-ebShare','Share buying in the early window','weekend pattern ≈ 20–25%',0,60,calc.ebShare,'@%')}
        ${row('calc-uplift','Extra seats the discount pulls in','your guess — the whole bet rides on this',0,30,calc.uplift,'+@')}
      </div>
      <div style="${pCard}" id="calc-result"></div>`;
    renderCalcResult();
  }
  function renderCalcResult(){
    const r=calcCompute(), m=v=>'$'+Math.round(v).toLocaleString();
    const pos=r.delta>=0;
    const capFlag=r.total>calc.cap?`<div style="font-size:12px;color:var(--coral);margin-top:6px">⚠ Projected ${r.total} exceeds cap ${calc.cap} — you’d sell out; trim the baseline or raise cap.</div>`:'';
    const verdict=pos
      ? `Early bird adds <b>${m(r.delta)}</b> to CM1 — but the whole gain rides on those +${calc.uplift} extra seats being real. Lose the uplift and you give margin away for free.`
      : `Early bird <b>costs ${m(Math.abs(r.delta))}</b> vs no promo at this uplift. You’d need more incremental seats to break even.`;
    document.getElementById('calc-result').innerHTML=`
      <div style="${pLbl}">Result</div>
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin:6px 0 10px">
        <div><div style="font-size:11px;color:var(--muted)">CM1 with early bird</div><div style="font-size:26px;font-weight:500;color:${pos?'var(--green)':'var(--coral)'}">${m(r.cm1)}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">CM1 no promo</div><div style="font-size:26px;font-weight:500">${m(r.baseCm1)}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">Mix</div><div style="font-size:15px;font-weight:500;padding-top:8px">${r.ebTix} EB · ${r.stdTix} std</div></div>
      </div>
      ${capFlag}
      <div style="font-size:13px;line-height:1.6;border-top:1px solid var(--border);padding-top:10px">${verdict}</div>`;
  }

  function buildFormula(){
    const city=`{${F.city}}="la"`;
    const hasVenue=`NOT({${F.venue}}="")`;
    const notCancelled=`NOT({Is Cancelled})`;
    if(S.view==='all')return`AND(${city},${hasVenue},${notCancelled})`;
    const[yr,mo]=S.month.split('-').map(Number);
    const pad=n=>String(n).padStart(2,'0');
    const prevEnd=new Date(yr,mo-1,0),nextStart=new Date(yr,mo,1);
    const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    return`AND(${city},${hasVenue},${notCancelled},IS_AFTER({${F.date}},'${fmt(prevEnd)}'),IS_BEFORE({${F.date}},'${fmt(nextStart)}'))`;
  }

  async function fetchAll(){
    const pass=localStorage.getItem(PASS_KEY);
    let all=[],offset=null;
    const formula=buildFormula();
    do{
      const p=new URLSearchParams({baseId:BASE,table:TABLE,pageSize:100});
      p.append('filterByFormula',formula);
      if(offset)p.append('offset',offset);
      const r=await fetch(`${PROXY}?${p}`,{headers:{'x-dash-pass':pass}});
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`${r.status} ${r.statusText}`);}
      const d=await r.json();
      if(d.error)throw new Error(d.error.message||'Airtable error');
      all=[...all,...d.records];offset=d.offset||null;
    }while(offset);
    return all;
  }

  // ── Date helpers ──────────────────────────────────────────
  function parseDate(str){
    if(!str)return null;
    const[y,m,d]=str.split('-').map(Number);
    return new Date(y,m-1,d);
  }
  function fmtDow(str){
    const d=parseDate(str);
    if(!d)return'—';
    return d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
  }
  function fmtShort(str){
    const d=parseDate(str);
    if(!d)return'';
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  // Get Monday of the week for a date string
  function getMondayKey(str){
    const d=parseDate(str);
    if(!d)return'';
    const dow=d.getDay();
    const offset=dow===0?-6:1-dow;
    const mon=new Date(d);mon.setDate(d.getDate()+offset);
    return mon.toISOString().slice(0,10);
  }
  function weekRangeLabel(monKey){
    const mon=parseDate(monKey);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return`${fmt(mon)} – ${fmt(sun)}`;
  }

  function f$(n){return n!=null&&n!==''?'$'+Math.round(n).toLocaleString():'—';}

  // ── Progress bar render ───────────────────────────────────
  function renderProgress(totRev){
    const goalFrac=MONTHLY_GOAL/BAR_MAX;    // 53.6%
    const curFrac=Math.min(1,totRev/BAR_MAX);
    const bonusStart=goalFrac*100;
    const preWidth=Math.min(curFrac,goalFrac)/goalFrac*bonusStart;
    const postLeft=bonusStart;
    const postWidth=curFrac>goalFrac?(curFrac-goalFrac)/(1-goalFrac)*(100-bonusStart):0;
    const hitGoal=totRev>=MONTHLY_GOAL;

    const ticks=[
      {val:WEEKLY_GOAL,label:'W1 · '+f$(WEEKLY_GOAL),goal:false},
      {val:WEEKLY_GOAL*2,label:'W2 · '+f$(WEEKLY_GOAL*2),goal:false},
      {val:WEEKLY_GOAL*3,label:'W3 · '+f$(WEEKLY_GOAL*3),goal:false},
      {val:MONTHLY_GOAL,label:`GOAL · ${f$(MONTHLY_GOAL)}`,goal:true},
    ];

    const ticksHTML=ticks.map(t=>{
      const pct=t.val/BAR_MAX*100;
      const cls=t.goal?'bar-tick goal-tick':'bar-tick';
      return`<div class="${cls}" style="left:${pct}%">${t.label}</div>
             <div style="position:absolute;top:0;bottom:0;left:${pct}%;width:1px;background:${t.goal?'var(--border2)':'var(--border)'}"></div>`;
    }).join('');

    const bonusHTML=hitGoal
      ?`<div class="bar-tick bonus-label" style="left:${bonusStart+(100-bonusStart)/2}%">BONUS ✦</div>`:'' ;

    const sect=document.getElementById('progress-section');
    sect.innerHTML=`
      <div class="progress-top">
        <span class="progress-title">Monthly revenue <span style="color:var(--border2);font-weight:300">· goal ${f$(MONTHLY_GOAL)}</span></span>
        <span class="progress-revenue">${f$(totRev)} <span style="color:${hitGoal?'var(--teal)':'var(--muted)'}">${hitGoal?'✓ goal hit':'/ '+f$(MONTHLY_GOAL)}</span></span>
      </div>
      <div class="bar-container">
        <div class="bar-track"></div>
        <div class="bar-bonus-zone" style="left:${bonusStart}%;right:0"></div>
        <div class="bar-fill-pre" style="width:${preWidth}%"></div>
        ${postWidth>0?`<div class="bar-fill-post" style="left:${postLeft}%;width:${postWidth}%"></div>`:''}
        <div class="bar-goal-line" style="left:${bonusStart}%"></div>
        ${ticksHTML}
        ${bonusHTML}
        <div style="position:absolute;bottom:-20px;left:0;font-size:10px;color:var(--faint)">$0</div>
        <div style="position:absolute;bottom:-20px;right:0;font-size:10px;color:var(--faint)">$50k</div>
      </div>`;
    sect.style.display=S.view==='month'?'':'none';
  }

  // ── Table render ──────────────────────────────────────────
  function render(){
    const{records,view,month,fetchedAt}=S;
    const sorted=[...records].sort((a,b)=>(a.fields[F.date]||'').localeCompare(b.fields[F.date]||''));
    const visible=sorted.filter(r=>!hiddenIds.has(r.id));
    const totTix=visible.reduce((a,r)=>a+(Number(r.fields[F.tickets])||0),0);
    const totRev=visible.reduce((a,r)=>a+revenueFor(r.fields),0);
    const avgRev=visible.length?Math.round(totRev/visible.length):0;

    // KPI cards
    const remaining=Math.max(0,MONTHLY_GOAL-totRev);
    const goalHit=totRev>=MONTHLY_GOAL;
    const kpiCards=[
      {label:'Shows'+(view==='month'?` · ${month}`:'  · all LA'),value:visible.length},
      {label:'Tickets sold',value:totTix.toLocaleString()},
      {label:'Revenue',value:f$(totRev),sub:view==='month'?(goalHit?'✓ goal hit':`${f$(remaining)} to goal`):null,subColor:goalHit?'var(--teal)':'var(--muted)'},
      view==='month'?{label:'Monthly goal',value:f$(MONTHLY_GOAL),sub:'$8,250 / week',subColor:'var(--muted)'}:null,
      {label:'Avg per show',value:f$(avgRev)},
    ].filter(Boolean);
    document.getElementById('kpi-grid').innerHTML=kpiCards.map(k=>`
      <div class="kpi-card">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}</div>
        ${k.sub?`<div style="font-size:11px;color:${k.subColor};margin-top:5px">${k.sub}</div>`:''}
      </div>`).join('');

    renderProgress(totRev);

    document.getElementById('seg-month').className='seg-btn'+(view==='month'?' active':'');
    document.getElementById('seg-all').className='seg-btn'+(view==='all'?' active':'');
    document.getElementById('month-input').style.display=view==='month'?'':'none';
    document.getElementById('count-label').textContent=`${visible.length} show${visible.length!==1?'s':''}`;

    if(!sorted.length){
      document.getElementById('tbl-body').innerHTML=`<tr class="empty-row"><td colspan="8">No shows found${view==='month'?' for '+month:''}</td></tr>`;
      document.getElementById('tbl-foot').innerHTML='';
      return;
    }

    // Group by week
    const weekMap=new Map();
    sorted.forEach(r=>{
      const key=getMondayKey(r.fields[F.date]||'');
      if(!weekMap.has(key))weekMap.set(key,[]);
      weekMap.get(key).push(r);
    });

    const weekKeys=[...weekMap.keys()].sort();
    let html='';
    let totCap=0;
    let projLoT=0,projHiT=0,projLoR=0,projHiR=0;

    // Hidden count for toolbar
    const totalHidden=sorted.filter(r=>hiddenIds.has(r.id)).length;
    const toggleBtn=document.getElementById('hidden-toggle-btn');
    if(totalHidden>0){
      toggleBtn.style.display='';
      toggleBtn.textContent=S.showHidden?`hide hidden (${totalHidden})`:`show hidden (${totalHidden})`;
    }else{
      toggleBtn.style.display='none';
    }

    weekKeys.forEach((wk,wi)=>{
      const allRows=weekMap.get(wk);
      // For totals, only count visible (non-hidden) rows
      const visRows=allRows.filter(r=>!hiddenIds.has(r.id));
      const wkTix=visRows.reduce((a,r)=>a+(Number(r.fields[F.tickets])||0),0);
      const wkRev=visRows.reduce((a,r)=>a+revenueFor(r.fields),0);
      const hitWeekly=wkRev>=WEEKLY_GOAL;
      const wkBand=wi%2===0?'week-even':'week-odd';
      const wkColor=view==='month'?(hitWeekly?'var(--teal)':'var(--amber)'):'var(--muted)';
      const wkGoalStr=view==='month'?` · ${f$(wkRev)} ${hitWeekly?'✓':''} / $${WEEKLY_GOAL.toLocaleString()} goal`:`· ${f$(wkRev)}`;

      // Skip week entirely if all rows hidden and not showing hidden
      const rowsToShow=allRows.filter(r=>S.showHidden||!hiddenIds.has(r.id));
      if(!rowsToShow.length)return;

      html+=`<tr class="week-hdr ${wkBand}">
        <td colspan="8" style="color:${wkColor}">
          Week ${wi+1} · ${weekRangeLabel(wk)}${wkGoalStr}
        </td>
      </tr>`;

      rowsToShow.forEach((r,ri)=>{
        const tix=Number(r.fields[F.tickets])||0;
        const cap=Number(r.fields[F.cap])||0;
        const rev=revenueFor(r.fields);
        const isHidden=hiddenIds.has(r.id);
        const isLast=ri===rowsToShow.length-1;
        if(!isHidden)totCap+=cap;
        const proj=!isHidden?projectShow(r.fields):null;
        if(proj){projLoT+=proj.loTix;projHiT+=proj.hiTix;projLoR+=proj.loRev;projHiR+=proj.hiRev;}

        let badge;
        if(tix===0&&rev===0){
          badge=`<span class="badge badge-na">—</span>`;
        }else if(tix>=MIN_RUN){
          badge=`<span class="badge badge-runs">RUNS</span>`;
        }else{
          badge=`<span class="badge badge-risk">${MIN_RUN-tix} to run</span>`;
        }

        const hideTitle=isHidden?'Restore show':'Hide show';
        const hideIcon=isHidden?'↩':'×';
        const hiddenClass=isHidden?' row-hidden':'';

        html+=`<tr class="${wkBand}${isLast?' week-last':''}${hiddenClass}">
          <td><div class="date-cell"><div class="date-dow">${fmtDow(r.fields[F.date])}</div><div class="date-day">${fmtShort(r.fields[F.date])}</div></div></td>
          <td>${r.fields[F.venue]||'—'}</td>
          <td class="r">${!isHidden&&tix>0?tix.toLocaleString():'—'}</td>
          <td class="r" style="color:var(--muted)">${!isHidden&&cap>0?cap.toLocaleString():'—'}</td>
          <td class="r">${!isHidden?badge:'—'}</td>
          <td class="r">${!isHidden&&rev>0?f$(rev):'—'}</td>
          <td class="r">${!isHidden?projCellHTML(proj):'—'}</td>
          <td style="padding:0 8px"><button class="hide-btn" onclick="${isHidden?'unhideRecord':'hideRecord'}('${r.id}')" title="${hideTitle}">${hideIcon}</button></td>
        </tr>`;
      });
    });

    document.getElementById('tbl-body').innerHTML=html;
    // Totals only from visible records
    const visSorted=sorted.filter(r=>!hiddenIds.has(r.id));
    const visTix=visSorted.reduce((a,r)=>a+(Number(r.fields[F.tickets])||0),0);
    const visRev=visSorted.reduce((a,r)=>a+revenueFor(r.fields),0);
    document.getElementById('tbl-foot').innerHTML=`<tr>
      <td colspan="2">Total · ${visSorted.length} show${visSorted.length!==1?'s':''}</td>
      <td class="r">${visTix.toLocaleString()}</td>
      <td class="r" style="color:var(--muted)">${totCap>0?totCap.toLocaleString():'—'}</td>
      <td class="r"></td>
      <td class="r">${f$(visRev)}</td>
      <td class="r" style="font-size:11px">${projHiR>0?f$(projLoR)+'–'+f$(projHiR):'—'}</td>
      <td></td>
    </tr>`;

    document.getElementById('footer-left').textContent=`Base: ${BASE} · Table: ${TABLE}`;
    document.getElementById('footer-right').textContent=fetchedAt?`Updated ${fetchedAt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`:'' ;
    document.getElementById('last-updated').textContent=fetchedAt?fetchedAt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
  }

  // ── Actions ───────────────────────────────────────────────
  async function doConnect(){
    const input=document.getElementById('token-input');
    const token=input.value.trim();
    if(!token)return;
    const errEl=document.getElementById('connect-error');
    const btn=document.getElementById('connect-btn');
    errEl.style.display='none';
    btn.innerHTML='<span class="spinner"></span>Connecting…';
    btn.disabled=true;
    localStorage.setItem(PASS_KEY,token);
    try{
      S.records=await fetchAll();S.fetchedAt=new Date();
      showDashboard();render();
    }catch(e){
      localStorage.removeItem(PASS_KEY);
      errEl.textContent=e.message;errEl.style.display='';
      btn.innerHTML='Connect';btn.disabled=false;
    }
  }

  async function doRefresh(){
    const btn=document.getElementById('refresh-btn');
    btn.textContent='…';btn.disabled=true;
    try{S.records=await fetchAll();S.fetchedAt=new Date();render();}
    catch(e){alert('Refresh failed: '+e.message);}
    btn.textContent='Refresh';btn.disabled=false;
  }

  function disconnect(){
    localStorage.removeItem(PASS_KEY);
    S={records:[],view:'month',month:'2026-06',fetchedAt:null};
    document.getElementById('dashboard-view').style.display='none';
    document.getElementById('connect-view').style.display='';
    document.getElementById('refresh-btn').style.display='none';
    document.getElementById('disconnect-btn').style.display='none';
    document.getElementById('last-updated').textContent='';
    const btn=document.getElementById('connect-btn');
    btn.innerHTML='Connect';btn.disabled=false;
    document.getElementById('token-input').value='';
    document.getElementById('connect-error').style.display='none';
  }

  function showDashboard(){
    document.getElementById('connect-view').style.display='none';
    document.getElementById('dashboard-view').style.display='';
    document.getElementById('refresh-btn').style.display='';
    document.getElementById('disconnect-btn').style.display='';
  }

  function hideRecord(id){
    hiddenIds.add(id);
    localStorage.setItem(HIDDEN_KEY,JSON.stringify([...hiddenIds]));
    render();
  }

  function unhideRecord(id){
    hiddenIds.delete(id);
    localStorage.setItem(HIDDEN_KEY,JSON.stringify([...hiddenIds]));
    render();
  }

  function toggleShowHidden(){
    S.showHidden=!S.showHidden;
    render();
  }

  function setView(v){S.view=v;doRefresh();}
  function setMonth(m){S.month=m;doRefresh();}

  document.getElementById('token-input').addEventListener('keydown',e=>{if(e.key==='Enter')doConnect();});
  window.addEventListener('load',()=>{
    const saved=localStorage.getItem(PASS_KEY);
    if(saved){document.getElementById('token-input').value=saved;doConnect();}
  });
</script>
</body>
</html>
