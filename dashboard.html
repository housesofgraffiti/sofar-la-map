<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofar LA — Sales</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F3EE;
      --surface: #FFFFFF;
      --surface2: #F0EDE6;
      --surface3: #E8E3D8;
      --border: #E0DCD2;
      --border2: #C8C4BA;
      --text: #1A1814;
      --muted: #8A8278;
      --faint: #C8C4BA;
      --amber: #C48820;
      --teal: #2A9F84;
      --coral: #C84A28;
      --blue: #5A80C8;
      --green: #5A9840;
      --header-h: 48px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .logo span {
      color: var(--muted);
      font-weight: 300;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .last-updated {
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Buttons ── */
    .btn {
      font-family: inherit;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid var(--border2);
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }

    .btn:hover { border-color: var(--text); color: var(--text); }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      width: 100%;
      padding: 9px;
      font-size: 13px;
      margin-top: 6px;
    }

    .btn-primary:hover { opacity: .85; }

    /* ── Connect screen ── */
    .connect-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--header-h));
      padding: 24px;
    }

    .connect-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
    }

    .connect-card h2 {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .connect-card p {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .token-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border2);
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }

    .token-input:focus { border-color: var(--text); }

    .connect-error {
      font-size: 12px;
      color: var(--coral);
      margin-top: 8px;
      display: none;
    }

    /* ── Dashboard ── */
    .main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    /* ── KPI grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 500;
      line-height: 1;
      color: var(--text);
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ── Progress bar ── */
    .progress-section {
      margin-bottom: 20px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .progress-track {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 99px;
      transition: width .5s ease;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .seg {
      display: flex;
      border: 1px solid var(--border2);
      border-radius: 4px;
      overflow: hidden;
    }

    .seg-btn {
      font-family: inherit;
      font-size: 12px;
      padding: 5px 12px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    .month-input {
      font-family: inherit;
      font-size: 12px;
      padding: 5px 10px;
      border: 1px solid var(--border2);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .spacer { flex: 1; }

    .count-label {
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    thead th.r { text-align: right; }

    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    td { padding: 10px 14px; font-size: 13px; }
    td.r { text-align: right; }
    td.dim { color: var(--muted); }

    tfoot td {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface2);
      border-top: 1px solid var(--border);
    }

    tfoot td.r { text-align: right; }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 11px;
      background: var(--surface3);
      color: var(--muted);
    }

    .empty-row td {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    /* ── Footer ── */
    .page-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--faint);
      flex-wrap: wrap;
      gap: 6px;
    }

    .warn-banner {
      margin-bottom: 14px;
      padding: 9px 14px;
      background: #FFF8E8;
      border: 1px solid #F0D080;
      border-radius: 6px;
      font-size: 12px;
      color: var(--amber);
    }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border2);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }

    @media (max-width: 600px) {
      .main { padding: 16px 14px 32px; }
      .header { padding: 0 14px; }
      .kpi-value { font-size: 22px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">Sofar LA <span>/ Sales</span></div>
  <div class="header-right">
    <span class="last-updated" id="last-updated"></span>
    <button class="btn" id="refresh-btn" style="display:none" onclick="doRefresh()">Refresh</button>
    <button class="btn" id="disconnect-btn" style="display:none" onclick="disconnect()">Disconnect</button>
  </div>
</header>

<!-- Connect screen -->
<div id="connect-view" class="connect-screen">
  <div class="connect-card">
    <h2>Connect to Airtable</h2>
    <p>Enter your personal access token to load Sofar LA show data. Saved locally in your browser — you won't need to re-enter it.</p>
    <input type="password" class="token-input" id="token-input" placeholder="pat…" autocomplete="off">
    <div class="connect-error" id="connect-error"></div>
    <button class="btn btn-primary" id="connect-btn" onclick="doConnect()">Connect</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard-view" class="main" style="display:none">
  <div class="kpi-grid" id="kpi-grid"></div>
  <div class="progress-section" id="progress-section" style="display:none">
    <div class="progress-header">
      <span>Revenue vs goal</span>
      <span id="progress-label"></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div id="warn-banner" class="warn-banner" style="display:none"></div>
  <div class="toolbar">
    <div class="seg">
      <button class="seg-btn active" id="seg-month" onclick="setView('month')">Month</button>
      <button class="seg-btn" id="seg-all" onclick="setView('all')">All LA</button>
    </div>
    <input type="month" class="month-input" id="month-input" value="2026-06" oninput="setMonth(this.value)">
    <div class="spacer"></div>
    <span class="count-label" id="count-label"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead id="tbl-head"></thead>
      <tbody id="tbl-body"></tbody>
      <tfoot id="tbl-foot"></tfoot>
    </table>
  </div>
  <div class="page-footer">
    <span id="footer-left"></span>
    <span id="footer-right"></span>
  </div>
</div>

<script>
  const PROXY = '/.netlify/functions/airtable-proxy';
  const BASE_ID = 'appFjmrBPpOKVSdpz';
  const TABLE = 'Events';
  const GOAL = 26775;
  const TOKEN_KEY = 'sofar_at_token';

  let S = {
    records: [],
    F: {},        // detected field names
    view: 'month',
    month: '2026-06',
    fetchedAt: null,
  };

  // ── Fetch ────────────────────────────────────────────────

  async function fetchAll(token) {
    let all = [], offset = null;
    do {
      const p = new URLSearchParams({ baseId: BASE_ID, table: TABLE, pageSize: 100 });
      if (offset) p.append('offset', offset);
      const r = await fetch(`${PROXY}?${p}`, { headers: { 'x-airtable-token': token } });
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        throw new Error(e.error?.message || `${r.status} ${r.statusText}`);
      }
      const d = await r.json();
      if (d.error) throw new Error(d.error.message || 'Airtable error');
      all = [...all, ...d.records];
      offset = d.offset || null;
    } while (offset);
    return all;
  }

  // ── Field detection ──────────────────────────────────────

  function detect(records) {
    if (!records.length) return {};
    const sample = records.slice(0, 15);
    const counts = {};
    records.forEach(r => Object.keys(r.fields).forEach(k => { counts[k] = (counts[k] || 0) + 1; }));
    const common = Object.keys(counts).filter(k => counts[k] > records.length * 0.1);

    let date = null, city = null, tickets = null, revenue = null, name = null, venue = null, status = null;

    common.forEach(k => {
      const lk = k.toLowerCase();
      const vals = sample.map(r => r.fields[k]).filter(v => v != null);
      if (!date && (lk.includes('date') || lk === 'when' || lk === 'start date') && vals.some(v => typeof v === 'string' && /\d{4}-\d{2}/.test(v))) date = k;
      if (!city && (lk === 'city' || lk === 'cities' || lk.includes('city')) && vals.length) city = k;
      if (!tickets && ((lk.includes('ticket') && (lk.includes('sold') || lk.includes('sale') || lk.includes('count') || lk.includes('total'))) || lk === 'tickets sold') && vals.some(v => typeof v === 'number')) tickets = k;
      if (!revenue && (lk.includes('revenue') || lk.includes('gross')) && vals.some(v => typeof v === 'number')) revenue = k;
      if (!name && (lk === 'name' || lk === 'title' || lk === 'show name' || lk === 'event name') && vals.some(v => typeof v === 'string')) name = k;
      if (!venue && (lk === 'venue' || lk === 'venue name') && vals.length) venue = k;
      if (!status && (lk === 'status' || lk === 'state') && vals.length) status = k;
    });

    // Fallback: first prevalent numeric field as tickets
    if (!tickets) {
      for (const k of common) {
        const v = sample.map(r => r.fields[k]).filter(v => typeof v === 'number');
        if (v.length > sample.length * 0.3) { tickets = k; break; }
      }
    }

    return { date, city, tickets, revenue, name, venue, status, all: common };
  }

  // ── Filter ───────────────────────────────────────────────

  function isLA(val) {
    if (!val) return false;
    if (Array.isArray(val)) return val.some(v => isLA(v));
    const s = String(val).toLowerCase().trim();
    return s === 'la' || s === 'los angeles' || s.includes('los angeles') || s === 'la, ca';
  }

  function filtered() {
    const { records, F, view, month } = S;
    return records.filter(r => {
      const f = r.fields;
      if (F.city && !isLA(f[F.city])) return false;
      if (view === 'all') return true;
      if (!F.date) return true;
      return f[F.date] && String(f[F.date]).startsWith(month);
    });
  }

  // ── Render ───────────────────────────────────────────────

  function fmtDate(val) {
    if (!val) return '—';
    try { return new Date(val).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
    catch { return String(val).slice(0, 10); }
  }

  function fmtVal(val) {
    if (val == null) return '—';
    if (Array.isArray(val)) return val.map(v => typeof v === 'object' ? JSON.stringify(v) : String(v)).join(', ');
    if (typeof val === 'object') return JSON.stringify(val);
    return String(val);
  }

  function f$(n) { return '$' + Math.round(n).toLocaleString(); }

  function showName(r) {
    const { F } = S;
    if (F.name && r.fields[F.name]) return fmtVal(r.fields[F.name]);
    if (F.venue && r.fields[F.venue]) return fmtVal(r.fields[F.venue]);
    return r.id;
  }

  function render() {
    const { F, view, month, records, fetchedAt } = S;
    const rows = filtered();
    const hasTix = !!F.tickets, hasRev = !!F.revenue, hasStat = !!F.status;
    const totTix = hasTix ? rows.reduce((a, r) => a + (Number(r.fields[F.tickets]) || 0), 0) : 0;
    const totRev = hasRev ? rows.reduce((a, r) => a + (Number(r.fields[F.revenue]) || 0), 0) : 0;
    const goalPct = Math.min(100, Math.round(totRev / GOAL * 100));

    // KPI cards
    const kpis = [
      { label: 'Shows' + (view === 'month' ? ` · ${month}` : ' · all LA'), value: rows.length.toString() },
      hasTix ? { label: 'Tickets sold', value: totTix.toLocaleString() } : null,
      hasRev ? { label: 'Revenue', value: f$(totRev) } : null,
      { label: 'Total LA records', value: records.length.toString() },
    ].filter(Boolean);

    document.getElementById('kpi-grid').innerHTML = kpis.map(k =>
      `<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div></div>`
    ).join('');

    // Progress bar
    const ps = document.getElementById('progress-section');
    if (hasRev && view === 'month') {
      ps.style.display = '';
      document.getElementById('progress-label').textContent = `${f$(totRev)} / ${f$(GOAL)}`;
      document.getElementById('progress-fill').style.width = goalPct + '%';
    } else {
      ps.style.display = 'none';
    }

    // Warning banner
    const wb = document.getElementById('warn-banner');
    if (!F.city) {
      wb.style.display = '';
      wb.textContent = 'City field not detected — showing all records. Share the exact field name from Airtable to enable LA filtering.';
    } else if (!hasTix && !hasRev) {
      wb.style.display = '';
      wb.textContent = 'No ticket or revenue fields detected. Share the exact Airtable field names.';
    } else {
      wb.style.display = 'none';
    }

    // Toolbar state
    document.getElementById('seg-month').className = 'seg-btn' + (view === 'month' ? ' active' : '');
    document.getElementById('seg-all').className = 'seg-btn' + (view === 'all' ? ' active' : '');
    document.getElementById('month-input').style.display = view === 'month' ? '' : 'none';
    document.getElementById('count-label').textContent = `${rows.length} show${rows.length !== 1 ? 's' : ''}`;

    // Table header
    document.getElementById('tbl-head').innerHTML = `<tr>
      <th>Show</th>
      <th>Date</th>
      ${hasTix ? '<th class="r">Tickets</th>' : ''}
      ${hasRev ? '<th class="r">Revenue</th>' : ''}
      ${hasStat ? '<th>Status</th>' : ''}
    </tr>`;

    // Sort by date ascending
    const sorted = [...rows].sort((a, b) => {
      const da = F.date ? String(a.fields[F.date] || '') : '';
      const db = F.date ? String(b.fields[F.date] || '') : '';
      return da.localeCompare(db);
    });

    // Table body
    if (sorted.length) {
      document.getElementById('tbl-body').innerHTML = sorted.map(r => {
        const tix = hasTix ? Number(r.fields[F.tickets]) || 0 : null;
        const rev = hasRev ? Number(r.fields[F.revenue]) || 0 : null;
        const stat = hasStat ? r.fields[F.status] : null;
        return `<tr>
          <td>${fmtVal(showName(r))}</td>
          <td class="dim">${fmtDate(F.date && r.fields[F.date])}</td>
          ${hasTix ? `<td class="r">${tix > 0 ? tix.toLocaleString() : '—'}</td>` : ''}
          ${hasRev ? `<td class="r">${rev > 0 ? f$(rev) : '—'}</td>` : ''}
          ${hasStat ? `<td><span class="badge">${fmtVal(stat)}</span></td>` : ''}
        </tr>`;
      }).join('');
    } else {
      const cols = 2 + (hasTix ? 1 : 0) + (hasRev ? 1 : 0) + (hasStat ? 1 : 0);
      document.getElementById('tbl-body').innerHTML =
        `<tr class="empty-row"><td colspan="${cols}">No shows found${view === 'month' ? ' for ' + month : ''}</td></tr>`;
    }

    // Table footer
    if (sorted.length && (hasTix || hasRev)) {
      document.getElementById('tbl-foot').innerHTML = `<tr>
        <td>Total</td><td></td>
        ${hasTix ? `<td class="r">${totTix.toLocaleString()}</td>` : ''}
        ${hasRev ? `<td class="r">${f$(totRev)}</td>` : ''}
        ${hasStat ? '<td></td>' : ''}
      </tr>`;
    } else {
      document.getElementById('tbl-foot').innerHTML = '';
    }

    // Footer
    document.getElementById('footer-left').textContent =
      `${records.length} records · fields: ${[F.date && 'date', F.city && 'city', F.name && 'name', F.tickets && 'tickets', F.revenue && 'revenue', F.status && 'status'].filter(Boolean).join(', ') || 'detecting…'}`;
    document.getElementById('footer-right').textContent =
      fetchedAt ? `updated ${fetchedAt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}` : '';
  }

  // ── Actions ──────────────────────────────────────────────

  async function doConnect() {
    const input = document.getElementById('token-input');
    const token = input.value.trim();
    const errEl = document.getElementById('connect-error');
    const btn = document.getElementById('connect-btn');

    if (!token) return;

    errEl.style.display = 'none';
    btn.innerHTML = '<span class="spinner"></span>Connecting…';
    btn.disabled = true;

    try {
      const records = await fetchAll(token);
      localStorage.setItem(TOKEN_KEY, token);
      S.records = records;
      S.F = detect(records);
      S.fetchedAt = new Date();
      showDashboard();
      render();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = '';
      btn.innerHTML = 'Connect';
      btn.disabled = false;
    }
  }

  async function doRefresh() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) return;
    const btn = document.getElementById('refresh-btn');
    const lu = document.getElementById('last-updated');
    btn.textContent = 'Refreshing…';
    btn.disabled = true;
    try {
      S.records = await fetchAll(token);
      S.F = detect(S.records);
      S.fetchedAt = new Date();
      render();
    } catch (e) {
      alert('Refresh failed: ' + e.message);
    }
    btn.textContent = 'Refresh';
    btn.disabled = false;
  }

  function disconnect() {
    localStorage.removeItem(TOKEN_KEY);
    S = { records: [], F: {}, view: 'month', month: '2026-06', fetchedAt: null };
    document.getElementById('dashboard-view').style.display = 'none';
    document.getElementById('connect-view').style.display = '';
    document.getElementById('refresh-btn').style.display = 'none';
    document.getElementById('disconnect-btn').style.display = 'none';
    document.getElementById('last-updated').textContent = '';
    document.getElementById('token-input').value = '';
    document.getElementById('connect-btn').innerHTML = 'Connect';
    document.getElementById('connect-btn').disabled = false;
    document.getElementById('connect-error').style.display = 'none';
  }

  function showDashboard() {
    document.getElementById('connect-view').style.display = 'none';
    document.getElementById('dashboard-view').style.display = '';
    document.getElementById('refresh-btn').style.display = '';
    document.getElementById('disconnect-btn').style.display = '';
  }

  function setView(v) {
    S.view = v;
    render();
  }

  function setMonth(m) {
    S.month = m;
    render();
  }

  // Keyboard shortcut: Enter on token input
  document.getElementById('token-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doConnect();
  });

  // Auto-connect if token is saved
  window.addEventListener('load', () => {
    const saved = localStorage.getItem(TOKEN_KEY);
    if (saved) {
      document.getElementById('token-input').value = saved;
      doConnect();
    }
  });
</script>
</body>
</html>
