  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#F0EDE6;--surface3:#E8E3D8;
      --border:#E0DCD2;--border2:#C8C4BA;--text:#1A1814;--muted:#8A8278;
      --faint:#C8C4BA;--amber:#C48820;--teal:#2A9F84;--coral:#C84A28;
      --green:#5A9840;--green-light:#EBF4E6;--amber-light:#FFF8E8;
      --header-h:48px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh;line-height:1.5}
    .header{position:sticky;top:0;z-index:20;height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .logo{font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
    .logo span{color:var(--muted);font-weight:300}
    .header-right{display:flex;align-items:center;gap:12px}
    .btn{font-family:inherit;font-size:12px;padding:5px 12px;border-radius:4px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s}
    .btn:hover{border-color:var(--text);color:var(--text)}
    .btn:disabled{opacity:.5;cursor:default}
    .btn-primary{background:var(--text);color:var(--bg);border-color:var(--text);width:100%;padding:9px;font-size:13px;margin-top:6px}
    .btn-primary:hover{opacity:.85}
    .connect-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - var(--header-h));padding:24px}
    .connect-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:32px;width:100%;max-width:400px}
    .connect-card h2{font-size:15px;font-weight:500;margin-bottom:6px}
    .connect-card p{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.7}
    .token-input{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:4px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
    .token-input:focus{border-color:var(--text)}
    .connect-error{font-size:12px;color:var(--coral);margin-top:8px;display:none}
    .main{max-width:1100px;margin:0 auto;padding:28px 24px 48px}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
    .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 18px}
    .kpi-label{font-size:11px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
    .kpi-value{font-size:26px;font-weight:500;line-height:1;color:var(--text)}

    /* ── Progress bar ── */
    .progress-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:20px}
    .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
    .progress-title{font-size:12px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
    .progress-revenue{font-size:18px;font-weight:500;color:var(--text)}
    .progress-revenue span{font-size:12px;color:var(--muted);font-weight:300}

    .bar-container{position:relative;height:10px;margin-bottom:22px}
    .bar-track{position:absolute;inset:0;background:var(--surface3);border-radius:99px;overflow:hidden}
    .bar-bonus-zone{position:absolute;top:0;bottom:0;background:var(--green-light);border-radius:0 99px 99px 0}
    .bar-fill-pre{position:absolute;top:0;bottom:0;left:0;background:var(--amber);border-radius:99px 0 0 99px;transition:width .5s ease}
    .bar-fill-post{position:absolute;top:0;bottom:0;background:var(--teal);border-radius:0 99px 99px 0;transition:width .5s ease,left .5s ease}
    .bar-goal-line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
    .bar-tick{position:absolute;top:14px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
    .bar-tick.goal-tick{color:var(--text);font-weight:500}
    .bar-tick.bonus-label{color:var(--teal)}

    /* ── Toolbar ── */
    .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .seg{display:flex;border:1px solid var(--border2);border-radius:4px;overflow:hidden}
    .seg-btn{font-family:inherit;font-size:12px;padding:5px 12px;border:none;background:none;color:var(--muted);cursor:pointer}
    .seg-btn.active{background:var(--text);color:var(--bg)}
    .month-input{font-family:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);outline:none}
    .spacer{flex:1}
    .count-label{font-size:12px;color:var(--muted)}

    /* ── Table ── */
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    thead th{padding:10px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
    thead th.r{text-align:right}
    tbody tr{transition:background .1s}
    tbody tr:hover{filter:brightness(.97)}
    .hide-btn{opacity:0;background:none;border:none;cursor:pointer;color:var(--faint);padding:2px 4px;font-size:14px;line-height:1;font-family:inherit;border-radius:3px;transition:opacity .15s,color .15s}
    tr:hover .hide-btn{opacity:1}
    .hide-btn:hover{color:var(--muted)}
    tr.row-hidden{opacity:.35}
    tr.row-hidden .hide-btn{opacity:1;color:var(--teal)}

    /* Week header rows */
    tr.week-hdr td{
      padding:7px 14px;
      font-size:11px;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-weight:500;
      border-top:2px solid var(--border2);
      border-bottom:1px solid var(--border);
    }
    tr.week-hdr:first-child td{border-top:none}

    /* Week bands - alternate surface/surface2 */
    tr.week-even{background:var(--surface)}
    tr.week-odd{background:var(--surface2)}
    tr.week-even:hover{background:#F5F3EE}
    tr.week-odd:hover{background:#E8E5DF}

    /* Bottom border on last row of each week */
    tr.week-last td{border-bottom:1px solid var(--border2)}

    td{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--border)}
    td.r{text-align:right}

    /* Date cell */
    .date-cell{line-height:1.3}
    .date-dow{font-size:13px;font-weight:500;color:var(--text);text-transform:uppercase;letter-spacing:.05em}
    .date-day{font-size:11px;color:var(--muted)}

    /* Viability badge */
    .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;letter-spacing:.04em;white-space:nowrap}
    .badge-runs{background:#E6F4EC;color:#2A7A46}
    .badge-risk{background:#FDE8E8;color:var(--coral)}
    .badge-na{background:var(--surface3);color:var(--muted)}

    tfoot td{padding:10px 14px;font-size:12px;font-weight:500;background:var(--surface2);border-top:2px solid var(--border2)}
    tfoot td.r{text-align:right}
    .empty-row td{padding:40px;text-align:center;color:var(--muted);border:none}
    .page-footer{margin-top:14px;display:flex;justify-content:space-between;font-size:11px;color:var(--faint);flex-wrap:wrap;gap:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .65s linear infinite;vertical-align:-2px;margin-right:6px}
    @media(max-width:640px){.main{padding:16px 12px 32px}.header{padding:0 14px}.kpi-value{font-size:20px}.bar-tick{font-size:9px}}
  </style>
</head>
<body>

<header class="header">
  <div class="logo">Sofar LA <span>/ Sales</span></div>
  <div class="header-right">
    <span id="last-updated" style="font-size:11px;color:var(--muted)"></span>
    <button class="btn" id="refresh-btn" style="display:none" onclick="doRefresh()">Refresh</button>
    <button class="btn" id="disconnect-btn" style="display:none" onclick="disconnect()">Disconnect</button>
  </div>
</header>

<div id="connect-view" class="connect-screen">
  <div class="connect-card">
    <h2>Connect to Airtable</h2>
    <p>Enter your Airtable personal access token. Saved in your browser — you won't need to re-enter it.</p>
    <input type="password" class="token-input" id="token-input" placeholder="pat…" autocomplete="off">
    <div class="connect-error" id="connect-error"></div>
    <button class="btn btn-primary" id="connect-btn" onclick="doConnect()">Connect</button>
  </div>
</div>

<div id="dashboard-view" class="main" style="display:none">
  <div class="kpi-grid" id="kpi-grid"></div>
  <div class="progress-section" id="progress-section"></div>
  <div class="toolbar">
    <div class="seg">
      <button class="seg-btn active" id="seg-month" onclick="setView('month')">Month</button>
      <button class="seg-btn" id="seg-all" onclick="setView('all')">All LA</button>
    </div>
    <input type="month" class="month-input" id="month-input" value="2026-06" oninput="setMonth(this.value)">
    <div class="spacer"></div>
    <button class="btn" id="hidden-toggle-btn" style="display:none;font-size:11px" onclick="toggleShowHidden()"></button>
    <span class="count-label" id="count-label"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:90px">Date</th>
          <th>Venue</th>
          <th class="r">Sold</th>
          <th class="r">Cap</th>
          <th class="r" title="Show runs at 30+ tickets sold">Status<br><span style="font-size:10px;letter-spacing:0;text-transform:none;font-weight:300">(runs ≥ 30)</span></th>
          <th class="r">Revenue</th>
          <th style="width:32px"></th>
        </tr>
      </thead>
      <tbody id="tbl-body"></tbody>
      <tfoot id="tbl-foot"></tfoot>
    </table>
  </div>
  <div class="page-footer">
    <span id="footer-left"></span>
    <span id="footer-right"></span>
  </div>
</div>

<script>
  const PROXY='/.netlify/functions/airtable-proxy';
  const BASE='appFjmrBPpOKVSdpz';
  const TABLE='Events';
  const MONTHLY_GOAL=26775;
  const WEEKLY_GOAL=6694;
  const BAR_MAX=50000;
  const MIN_RUN=30;
  const TOKEN_KEY='sofar_at_token';
  const HIDDEN_KEY='sofar_hidden_ids';
  const F={date:'Show Date',city:'City',venue:'Venue Name',tickets:'Tickets Sold',cap:'Tickets Available',revenue:'USD Revenue'};
  let S={records:[],view:'month',month:'2026-06',fetchedAt:null,showHidden:false};
  let hiddenIds=new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY)||'[]'));

  function buildFormula(){
    const city=`{${F.city}}="la"`;
    const hasVenue=`NOT({${F.venue}}="")`;
    if(S.view==='all')return`AND(${city},${hasVenue})`;
    const[yr,mo]=S.month.split('-').map(Number);
    const pad=n=>String(n).padStart(2,'0');
    const prevEnd=new Date(yr,mo-1,0),nextStart=new Date(yr,mo,1);
    const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    return`AND(${city},${hasVenue},IS_AFTER({${F.date}},'${fmt(prevEnd)}'),IS_BEFORE({${F.date}},'${fmt(nextStart)}'))`;
  }

  async function fetchAll(){
    const token=localStorage.getItem(TOKEN_KEY);
    let all=[],offset=null;
    const formula=buildFormula();
    do{
      const p=new URLSearchParams({baseId:BASE,table:TABLE,pageSize:100});
      p.append('filterByFormula',formula);
      if(offset)p.append('offset',offset);
      const r=await fetch(`${PROXY}?${p}`,{headers:{'x-airtable-token':token}});
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`${r.status} ${r.statusText}`);}
      const d=await r.json();
      if(d.error)throw new Error(d.error.message||'Airtable error');
      all=[...all,...d.records];offset=d.offset||null;
    }while(offset);
    return all;
  }

  // ── Date helpers ──────────────────────────────────────────
  function parseDate(str){
    if(!str)return null;
    const[y,m,d]=str.split('-').map(Number);
    return new Date(y,m-1,d);
  }
  function fmtDow(str){
    const d=parseDate(str);
    if(!d)return'—';
    return d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
  }
  function fmtShort(str){
    const d=parseDate(str);
    if(!d)return'';
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  // Get Monday of the week for a date string
  function getMondayKey(str){
    const d=parseDate(str);
    if(!d)return'';
    const dow=d.getDay();
    const offset=dow===0?-6:1-dow;
    const mon=new Date(d);mon.setDate(d.getDate()+offset);
    return mon.toISOString().slice(0,10);
  }
  function weekRangeLabel(monKey){
    const mon=parseDate(monKey);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return`${fmt(mon)} – ${fmt(sun)}`;
  }

  function f$(n){return n!=null&&n!==''?'$'+Math.round(n).toLocaleString():'—';}

  // ── Progress bar render ───────────────────────────────────
  function renderProgress(totRev){
    const goalFrac=MONTHLY_GOAL/BAR_MAX;    // 53.6%
    const curFrac=Math.min(1,totRev/BAR_MAX);
    const bonusStart=goalFrac*100;
    const preWidth=Math.min(curFrac,goalFrac)/goalFrac*bonusStart;
    const postLeft=bonusStart;
    const postWidth=curFrac>goalFrac?(curFrac-goalFrac)/(1-goalFrac)*(100-bonusStart):0;
    const hitGoal=totRev>=MONTHLY_GOAL;

    const ticks=[
      {val:WEEKLY_GOAL,label:'W1 · '+f$(WEEKLY_GOAL),goal:false},
      {val:WEEKLY_GOAL*2,label:'W2 · '+f$(WEEKLY_GOAL*2),goal:false},
      {val:WEEKLY_GOAL*3,label:'W3 · '+f$(WEEKLY_GOAL*3),goal:false},
      {val:MONTHLY_GOAL,label:`GOAL · ${f$(MONTHLY_GOAL)}`,goal:true},
    ];

    const ticksHTML=ticks.map(t=>{
      const pct=t.val/BAR_MAX*100;
      const cls=t.goal?'bar-tick goal-tick':'bar-tick';
      return`<div class="${cls}" style="left:${pct}%">${t.label}</div>
             <div style="position:absolute;top:0;bottom:0;left:${pct}%;width:1px;background:${t.goal?'var(--border2)':'var(--border)'}"></div>`;
    }).join('');

    const bonusHTML=hitGoal
      ?`<div class="bar-tick bonus-label" style="left:${bonusStart+(100-bonusStart)/2}%">BONUS ✦</div>`:'' ;

    const sect=document.getElementById('progress-section');
    sect.innerHTML=`
      <div class="progress-top">
        <span class="progress-title">Monthly revenue <span style="color:var(--border2);font-weight:300">· goal ${f$(MONTHLY_GOAL)}</span></span>
        <span class="progress-revenue">${f$(totRev)} <span style="color:${hitGoal?'var(--teal)':'var(--muted)'}">${hitGoal?'✓ goal hit':'/ '+f$(MONTHLY_GOAL)}</span></span>
      </div>
      <div class="bar-container">
        <div class="bar-track"></div>
        <div class="bar-bonus-zone" style="left:${bonusStart}%;right:0"></div>
        <div class="bar-fill-pre" style="width:${preWidth}%"></div>
        ${postWidth>0?`<div class="bar-fill-post" style="left:${postLeft}%;width:${postWidth}%"></div>`:''}
        <div class="bar-goal-line" style="left:${bonusStart}%"></div>
        ${ticksHTML}
        ${bonusHTML}
        <div style="position:absolute;bottom:-20px;left:0;font-size:10px;color:var(--faint)">$0</div>
        <div style="position:absolute;bottom:-20px;right:0;font-size:10px;color:var(--faint)">$50k</div>
      </div>`;
    sect.style.display=S.view==='month'?'':'none';
  }

  // ── Table render ──────────────────────────────────────────
  function render(){
    const{records,view,month,fetchedAt}=S;
    const sorted=[...records].sort((a,b)=>(a.fields[F.date]||'').localeCompare(b.fields[F.date]||''));
    const visible=sorted.filter(r=>!hiddenIds.has(r.id));
    const totTix=visible.reduce((a,r)=>a+(Number(r.fields[F.tickets])||0),0);
    const totRev=visible.reduce((a,r)=>a+(Number(r.fields[F.revenue])||0),0);
    const avgRev=visible.length?Math.round(totRev/visible.length):0;

    // KPI cards
    const remaining=Math.max(0,MONTHLY_GOAL-totRev);
    const goalHit=totRev>=MONTHLY_GOAL;
    const kpiCards=[
      {label:'Shows'+(view==='month'?` · ${month}`:'  · all LA'),value:visible.length},
      {label:'Tickets sold',value:totTix.toLocaleString()},
      {label:'Revenue',value:f$(totRev),sub:view==='month'?(goalHit?'✓ goal hit':`${f$(remaining)} to goal`):null,subColor:goalHit?'var(--teal)':'var(--muted)'},
      view==='month'?{label:'Monthly goal',value:f$(MONTHLY_GOAL),sub:'$6,694 / week',subColor:'var(--muted)'}:null,
      {label:'Avg per show',value:f$(avgRev)},
    ].filter(Boolean);
    document.getElementById('kpi-grid').innerHTML=kpiCards.map(k=>`
      <div class="kpi-card">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}</div>
        ${k.sub?`<div style="font-size:11px;color:${k.subColor};margin-top:5px">${k.sub}</div>`:''}
      </div>`).join('');

    renderProgress(totRev);

    document.getElementById('seg-month').className='seg-btn'+(view==='month'?' active':'');
    document.getElementById('seg-all').className='seg-btn'+(view==='all'?' active':'');
    document.getElementById('month-input').style.display=view==='month'?'':'none';
    document.getElementById('count-label').textContent=`${visible.length} show${visible.length!==1?'s':''}`;

    if(!sorted.length){
      document.getElementById('tbl-body').innerHTML=`<tr class="empty-row"><td colspan="6">No shows found${view==='month'?' for '+month:''}</td></tr>`;
      document.getElementById('tbl-foot').innerHTML='';
      return;
    }

    // Group by week
    const weekMap=new Map();
    sorted.forEach(r=>{
      const key=getMondayKey(r.fields[F.date]||'');
      if(!weekMap.has(key))weekMap.set(key,[]);
      weekMap.get(key).push(r);
    });

    const weekKeys=[...weekMap.keys()].sort();
    let html='';
    let totCap=0;

    // Hidden count for toolbar
    const totalHidden=sorted.filter(r=>hiddenIds.has(r.id)).length;
    const toggleBtn=document.getElementById('hidden-toggle-btn');
    if(totalHidden>0){
      toggleBtn.style.display='';
      toggleBtn.textContent=S.showHidden?`hide hidden (${totalHidden})`:`show hidden (${totalHidden})`;
    }else{
      toggleBtn.style.display='none';
    }

    weekKeys.forEach((wk,wi)=>{
      const allRows=weekMap.get(wk);
      // For totals, only count visible (non-hidden) rows
      const visRows=allRows.filter(r=>!hiddenIds.has(r.id));
      const wkTix=visRows.reduce((a,r)=>a+(Number(r.fields[F.tickets])||0),0);
      const wkRev=visRows.reduce((a,r)=>a+(Number(r.fields[F.revenue])||0),0);
      const hitWeekly=wkRev>=WEEKLY_GOAL;
      const wkBand=wi%2===0?'week-even':'week-odd';
      const wkColor=view==='month'?(hitWeekly?'var(--teal)':'var(--amber)'):'var(--muted)';
      const wkGoalStr=view==='month'?` · ${f$(wkRev)} ${hitWeekly?'✓':''} / $${WEEKLY_GOAL.toLocaleString()} goal`:`· ${f$(wkRev)}`;

      // Skip week entirely if all rows hidden and not showing hidden
      const rowsToShow=allRows.filter(r=>S.showHidden||!hiddenIds.has(r.id));
      if(!rowsToShow.length)return;

      html+=`<tr class="week-hdr ${wkBand}">
        <td colspan="7" style="color:${wkColor}">
          Week ${wi+1} · ${weekRangeLabel(wk)}${wkGoalStr}
        </td>
      </tr>`;

      rowsToShow.forEach((r,ri)=>{
        const tix=Number(r.fields[F.tickets])||0;
        const cap=Number(r.fields[F.cap])||0;
        const rev=Number(r.fields[F.revenue])||0;
        const isHidden=hiddenIds.has(r.id);
        const isLast=ri===rowsToShow.length-1;
        if(!isHidden)totCap+=cap;

        let badge;
        if(tix===0&&rev===0){
          badge=`<span class="badge badge-na">—</span>`;
        }else if(tix>=MIN_RUN){
          badge=`<span class="badge badge-runs">RUNS</span>`;
        }else{
          badge=`<span class="badge badge-risk">${MIN_RUN-tix} to run</span>`;
        }

        const hideTitle=isHidden?'Restore show':'Hide show';
        const hideIcon=isHidden?'↩':'×';
        const hiddenClass=isHidden?' row-hidden':'';

        html+=`<tr class="${wkBand}${isLast?' week-last':''}${hiddenClass}">
          <td><div class="date-cell"><div class="date-dow">${fmtDow(r.fields[F.date])}</div><div class="date-day">${fmtShort(r.fields[F.date])}</div></div></td>
          <td>${r.fields[F.venue]||'—'}</td>
          <td class="r">${!isHidden&&tix>0?tix.toLocaleString():'—'}</td>
          <td class="r" style="color:var(--muted)">${!isHidden&&cap>0?cap.toLocaleString():'—'}</td>
          <td class="r">${!isHidden?badge:'—'}</td>
          <td class="r">${!isHidden&&rev>0?f$(rev):'—'}</td>
          <td style="padding:0 8px"><button class="hide-btn" onclick="${isHidden?'unhideRecord':'hideRecord'}('${r.id}')" title="${hideTitle}">${hideIcon}</button></td>
        </tr>`;
      });
    });

    document.getElementById('tbl-body').innerHTML=html;
    // Totals only from visible records
    const visSorted=sorted.filter(r=>!hiddenIds.has(r.id));
    const visTix=visSorted.reduce((a,r)=>a+(Number(r.fields[F.tickets])||0),0);
    const visRev=visSorted.reduce((a,r)=>a+(Number(r.fields[F.revenue])||0),0);
    document.getElementById('tbl-foot').innerHTML=`<tr>
      <td colspan="2">Total · ${visSorted.length} show${visSorted.length!==1?'s':''}</td>
      <td class="r">${visTix.toLocaleString()}</td>
      <td class="r" style="color:var(--muted)">${totCap>0?totCap.toLocaleString():'—'}</td>
      <td class="r"></td>
      <td class="r">${f$(visRev)}</td>
      <td></td>
    </tr>`;

    document.getElementById('footer-left').textContent=`Base: ${BASE} · Table: ${TABLE}`;
    document.getElementById('footer-right').textContent=fetchedAt?`Updated ${fetchedAt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`:'' ;
    document.getElementById('last-updated').textContent=fetchedAt?fetchedAt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
  }

  // ── Actions ───────────────────────────────────────────────
  async function doConnect(){
    const input=document.getElementById('token-input');
    const token=input.value.trim();
    if(!token)return;
    const errEl=document.getElementById('connect-error');
    const btn=document.getElementById('connect-btn');
    errEl.style.display='none';
    btn.innerHTML='<span class="spinner"></span>Connecting…';
    btn.disabled=true;
    localStorage.setItem(TOKEN_KEY,token);
    try{
      S.records=await fetchAll();S.fetchedAt=new Date();
      showDashboard();render();
    }catch(e){
      localStorage.removeItem(TOKEN_KEY);
      errEl.textContent=e.message;errEl.style.display='';
      btn.innerHTML='Connect';btn.disabled=false;
    }
  }

  async function doRefresh(){
    const btn=document.getElementById('refresh-btn');
    btn.textContent='…';btn.disabled=true;
    try{S.records=await fetchAll();S.fetchedAt=new Date();render();}
    catch(e){alert('Refresh failed: '+e.message);}
    btn.textContent='Refresh';btn.disabled=false;
  }

  function disconnect(){
    localStorage.removeItem(TOKEN_KEY);
    S={records:[],view:'month',month:'2026-06',fetchedAt:null};
    document.getElementById('dashboard-view').style.display='none';
    document.getElementById('connect-view').style.display='';
    document.getElementById('refresh-btn').style.display='none';
    document.getElementById('disconnect-btn').style.display='none';
    document.getElementById('last-updated').textContent='';
    const btn=document.getElementById('connect-btn');
    btn.innerHTML='Connect';btn.disabled=false;
    document.getElementById('token-input').value='';
    document.getElementById('connect-error').style.display='none';
  }

  function showDashboard(){
    document.getElementById('connect-view').style.display='none';
    document.getElementById('dashboard-view').style.display='';
    document.getElementById('refresh-btn').style.display='';
    document.getElementById('disconnect-btn').style.display='';
  }

  function hideRecord(id){
    hiddenIds.add(id);
    localStorage.setItem(HIDDEN_KEY,JSON.stringify([...hiddenIds]));
    render();
  }

  function unhideRecord(id){
    hiddenIds.delete(id);
    localStorage.setItem(HIDDEN_KEY,JSON.stringify([...hiddenIds]));
    render();
  }

  function toggleShowHidden(){
    S.showHidden=!S.showHidden;
    render();
  }

  function setView(v){S.view=v;doRefresh();}
  function setMonth(m){S.month=m;doRefresh();}

  document.getElementById('token-input').addEventListener('keydown',e=>{if(e.key==='Enter')doConnect();});
  window.addEventListener('load',()=>{
    const saved=localStorage.getItem(TOKEN_KEY);
    if(saved){document.getElementById('token-input').value=saved;doConnect();}
  });
</script>
</body>
</html>
